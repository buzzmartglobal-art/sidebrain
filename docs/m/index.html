<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sidebrain">
<meta name="theme-color" content="#0d0f13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Sidebrain</title>
<style>
  :root{
    --bg:#0d0f13; --bg2:#14171c; --bg3:#1b1f26; --line:#262b33;
    --fg:#e8ebf0; --dim:#8b93a1; --accent:#5b8cff; --accent2:#8b5cf6;
    --ok:#38d39f; --warn:#f5a524; --err:#ff6b6b;
    --sb: env(safe-area-inset-bottom, 0px);
    --st: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    -webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
  #app{display:flex;flex-direction:column;height:100dvh;height:100vh}
  @supports (height:100dvh){#app{height:100dvh}}

  /* 顶栏 */
  header{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 10px) 14px 10px;
    background:rgba(13,15,19,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);z-index:5}
  .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .dot{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 14px rgba(91,140,255,.45);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:0 0 auto}
  .brand b{font-size:15.5px;letter-spacing:.2px}
  .brand span{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbtn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;color:var(--fg);background:var(--bg2)}
  .hbtn:active{background:var(--bg3)}

  /* 消息 */
  #feed{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 6px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
  .row{display:flex;gap:8px;max-width:100%}
  .row.me{justify-content:flex-end}
  .bub{max-width:82%;padding:10px 13px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);
    white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-size:15px}
  .row.me .bub{background:linear-gradient(135deg,#2f5fe0,#4c7bf5);border-color:transparent;color:#fff;border-bottom-right-radius:6px}
  .row.ai .bub{border-bottom-left-radius:6px}
  .bub p{margin:0 0 8px}.bub p:last-child{margin-bottom:0}
  .bub pre{background:#0a0c10;border:1px solid var(--line);border-radius:10px;padding:9px 11px;overflow-x:auto;font-size:12.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin:6px 0}
  .bub code{background:#0a0c10;border-radius:5px;padding:1px 5px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .bub pre code{background:none;padding:0}
  .bub h1,.bub h2,.bub h3{font-size:15.5px;margin:10px 0 6px}
  .bub ul,.bub ol{margin:6px 0;padding-left:20px}
  .bub a{color:#9dbaff}
  .bub img{max-width:100%;border-radius:10px;margin:6px 0;display:block}
  .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;font-size:11.5px;color:var(--dim)}
  .meta button{color:var(--dim);padding:4px 8px;border-radius:8px;background:#191d24}
  .meta button:active{background:var(--bg3)}
  .att-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:9px;background:#0f1419;
    border:1px solid var(--line);font-size:12px;color:#a9b2c0;margin-top:6px}
  .att-chip img{width:40px;height:40px;object-fit:cover;border-radius:6px}

  /* 等待 */
  .typing{display:flex;gap:5px;padding:4px 2px}
  .typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

  /* 空状态 */
  .hello{margin:auto 0;text-align:center;color:var(--dim);padding:10px 6px 0}
  .hello h1{font-size:22px;color:var(--fg);margin:0 0 8px;letter-spacing:.2px}
  .hello p{margin:0 0 16px;font-size:13.5px}
  .quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .quick button{padding:9px 13px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);font-size:13.5px;color:#cdd4e0}
  .quick button:active{background:var(--bg3)}

  /* 输入区 */
  body.inbrowser #composer{padding-bottom:calc(var(--sb) + 26px)}
  #upbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 6px);z-index:80;
         background:linear-gradient(140deg,#5b8cff,#8b5cf6);color:#fff;font-size:12.5px;font-weight:600;
         padding:7px 14px;border-radius:20px;box-shadow:0 8px 22px rgba(0,0,0,.35);cursor:pointer}
  .pill{display:none;flex:0 0 auto;margin-left:auto;font-size:11.5px;font-weight:600;letter-spacing:.2px;
        color:#c9d7ff;background:rgba(91,140,255,.16);border:1px solid rgba(91,140,255,.35);
        border-radius:20px;padding:3px 9px;white-space:nowrap}
  .pill.on{display:inline-block}
  .coachbar{display:none;gap:7px;padding:6px 12px 2px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .coachbar.on{display:flex}
  #hstate{display:none;align-items:center;gap:6px;padding:0 14px;font-size:12.5px;color:var(--dim);min-height:0}
  #hstate.listen,#hstate.think,#hstate.speak{display:flex}
  #hstate.listen{color:#7dd48a}
  #hstate.think{color:#f0c674}
  #hstate.speak{color:#7fa8ff}
  .cchip.xp{background:#2a2413;border-color:#4a3d18;color:#f0c674}
  .cchip{flex:0 0 auto;font:600 13px/1 -apple-system,"PingFang SC",sans-serif;color:#a9b7d1;background:#151a23;
         border:1px solid #262d3a;border-radius:20px;padding:8px 13px;white-space:nowrap}
  .cchip.act{color:#fff;background:linear-gradient(140deg,#5b8cff,#8b5cf6);border-color:transparent}
  body.coachmode .quick button{display:none}
  #composer{flex:0 0 auto;padding:8px 12px calc(var(--sb) + 10px);background:rgba(13,15,19,.96);
    backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .attbar{display:flex;gap:8px;flex-wrap:wrap;padding:0 2px 8px}
  .attbar:empty{display:none}
  .chip{display:flex;align-items:center;gap:7px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;
    padding:5px 9px;font-size:12px;color:#b9c1cf;max-width:100%}
  .chip img{width:34px;height:34px;border-radius:7px;object-fit:cover}
  .chip b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
  .chip span{color:var(--dim)}
  .chip .x{color:var(--dim);padding:0 2px;font-size:14px}
  .box{display:flex;align-items:flex-end;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 12px}
  .box textarea{flex:1;resize:none;max-height:130px;padding:7px 0;font-size:15.5px;line-height:1.45;background:none}
  .box textarea::placeholder{color:#5f6875}
  .icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;color:var(--dim);flex:0 0 auto}
  .icon:active{background:var(--bg3)}
  .icon.on{color:var(--accent);background:rgba(91,140,255,.14)}
  .icon.rec{color:#fff;background:#e5484d;animation:pulse 1.1s infinite}
  @keyframes pulse{50%{opacity:.55}}
  #send{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;color:#fff;font-size:16px;flex:0 0 auto;transition:opacity .15s}
  #send:disabled{opacity:.35}
  .hint{text-align:center;font-size:11px;color:#5f6875;padding:6px 0 0}

  /* 面板（笔记/设置）底部抽屉 */
  #reader{position:fixed;left:10px;right:10px;bottom:calc(var(--sb) + 78px);z-index:39;display:none;background:#171b23;border:1px solid #2a3040;border-radius:14px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  #reader.on{display:block}
  #reader .rdt{font-size:12.5px;color:#cfd6e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:7px}
  #reader .rdb{height:3px;background:#262c38;border-radius:2px;overflow:hidden}
  #reader .rdb i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#5b8cff,#a06bff);transition:width .3s}
  #reader .rdc{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#8b93a1}
  #reader .rdc #rdPct{margin-right:auto}
  #reader .rdb2{background:#222836;color:#dbe2ee;border:0;border-radius:9px;padding:5px 11px;font-size:13px}
  #reader .rdb2:active{background:#2c3444}
  .bkrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #1b1f28}
  .bkrow:active{background:#171b23}
  .bkrow .t{flex:1;min-width:0}
  .bkrow .t b{display:block;font-size:14px;font-weight:500;color:#e6e9ef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bkrow .t span{font-size:12px;color:#7d8697}
  .bkrow .k{color:#6aa0ff;font-size:13px}
  .sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:var(--bg);
    transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);visibility:hidden}
  .sheet.on{transform:translateY(0);visibility:visible}
  .sheet header{border-bottom:1px solid var(--line)}
  .sheet .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(var(--sb) + 16px)}
  .sheet .body.flush{padding:0}
  .rowitem{display:flex;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .rowitem:active{background:var(--bg2)}
  .rowitem .t{flex:1;min-width:0}
  .rowitem .t b{display:block;font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowitem .t span{display:block;font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rowitem .k{color:var(--dim);font-size:13px}
  .sec{font-size:12px;color:var(--dim);letter-spacing:.4px;margin:18px 2px 6px;text-transform:uppercase}
  .empty{color:var(--dim);text-align:center;padding:40px 10px;font-size:13.5px}
  .btn{display:block;width:100%;padding:13px;border-radius:13px;background:var(--bg2);border:1px solid var(--line);
    text-align:center;font-size:15px;margin:8px 0}
  .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;font-weight:600}
  .btn:active{filter:brightness(1.15)}
  .note-title{font-size:12.5px;color:var(--dim);padding:2px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:12px;word-break:break-all}
  .note{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;font-size:15px;line-height:1.62}
  .note h1,.note h2,.note h3{color:#fff;margin:16px 0 8px;line-height:1.3}
  .note h1{font-size:20px}.note h2{font-size:17.5px}.note h3{font-size:16px}
  .note ul,.note ol{padding-left:22px}
  .note pre{background:#0a0c10;border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;font-size:12.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre}
  .note code{background:#0a0c10;padding:1px 5px;border-radius:5px;font-size:12.5px}
  .note blockquote{border-left:3px solid var(--accent);margin:8px 0;padding:2px 0 2px 11px;color:#b9c1cf}
  .note hr{border:0;border-top:1px solid var(--line);margin:14px 0}
  .note .nl{color:#9dbaff;text-decoration:underline;text-underline-offset:2px}
  .note .back{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim)}
  .note .back b{color:#b9c1cf;font-weight:500;display:block;margin-bottom:6px}
  .note .back .nl{display:inline-block;margin:0 8px 6px 0}
  .ninputs{display:flex;flex-direction:column;gap:9px;margin:10px 0}
  .ninputs input,.ninputs textarea{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 12px;
    font-size:14.5px;color:var(--fg);width:100%}
  .ninputs textarea{min-height:44vh;font-size:14px;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .toast{position:fixed;left:50%;bottom:calc(var(--sb) + 90px);transform:translate(-50%,20px);background:#22272f;color:#fff;
    padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:.25s;z-index:90;pointer-events:none;
    box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:86vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* 登录 */
  #gate{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 0%,#1a2030 0%,var(--bg) 58%);
    display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 20px) 26px calc(var(--sb) + 26px)}
  #gate.hide{display:none}
  #gate .logo{width:64px;height:64px;border-radius:19px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-size:30px;margin-bottom:22px;box-shadow:0 14px 40px rgba(91,140,255,.32)}
  #gate h1{font-size:27px;margin:0 0 8px;line-height:1.2;letter-spacing:-.3px}
  #gate p{color:var(--dim);margin:0 0 26px;font-size:14px;line-height:1.6}
  #gate input{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:15px 15px;font-size:16px;
    color:var(--fg);margin-bottom:12px}
  #gate .tip{font-size:11.5px;color:#5f6875;margin-top:16px;text-align:center;line-height:1.6}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;
    animation:sp .8s linear infinite;display:inline-block;vertical-align:-3px;margin-right:7px}
  @keyframes sp{to{transform:rotate(360deg)}}

  #howto{position:fixed;inset:0;z-index:120;background:rgba(6,8,12,.72);display:flex;align-items:flex-end;justify-content:center;padding:0 0 0 0;backdrop-filter:blur(6px)}
  #howto.hide{display:none}
  #howto .card2{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));border-top:1px solid #263041;max-height:86dvh;overflow:auto}
  #howto h3{margin:0 0 4px;font-size:18px}
  #howto p.sub{margin:0 0 12px;color:var(--dim);font-size:13px}
  #howto ol{margin:0;padding-left:20px;font-size:15px;line-height:1.55}
  #howto ol li{margin-bottom:10px}
  #howto code{background:#1a2231;padding:1px 5px;border-radius:5px;font-size:13px}
  #howto .warn{margin-top:12px;font-size:13px;color:#f0c674;background:#2a2413;border:1px solid #4a3d18;border-radius:10px;padding:9px 11px}
  #howto button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div class="dot">S</div>
      <div style="min-width:0">
        <b>Sidebrain</b>
        <span id="sub">连上了</span>
      </div>
    </div>
    <span class="pill" id="modepill"></span>
    <button class="hbtn" id="btnNotes" title="笔记">🗒</button>
    <button class="hbtn" id="btnMenu" title="设置">⋯</button>
  </header>

  <div id="feed">
    <div class="hello" id="hello">
      <h1 id="h1">要问点什么？</h1>
      <p id="hp">截图、文件、语音都能直接发进来，回答会自动存进你的笔记库。</p>
      <div class="quick" id="quick"></div>
    </div>
  </div>

  <div class="coachbar" id="coachbar"></div>
  <div class="hstate" id="hstate"></div>

  <div id="composer">
    <div class="attbar" id="attbar"></div>
    <div class="box">
      <textarea id="ta" rows="1" placeholder="发消息…"></textarea>
      <button class="icon" id="btnFile" title="文件">📎</button>
      <button class="icon" id="btnMic" title="语音">🎤</button>
      <button id="send" title="发送">↑</button>
    </div>
    <div class="hint" id="hint">回答来自自动选中的模型，你不用挑</div>
  </div>
</div>

<!-- 笔记 -->
<div class="sheet" id="noteSheet">
  <header>
    <button class="hbtn" id="noteBack">←</button>
    <div class="brand"><b id="noteTitle">笔记</b><span id="noteSub"></span></div>
    <button class="hbtn" id="noteNew">＋</button>
  </header>
  <div class="body" id="noteBody"></div>
</div>

<!-- 设置 -->
<div class="sheet" id="menuSheet">
  <header>
    <button class="hbtn" id="menuBack">←</button>
    <div class="brand"><b>设置</b></div>
  </header>
  <div class="body" id="menuBody"></div>
</div>

<!-- 书单 -->
<div class="sheet" id="bookSheet">
  <header>
    <button class="hbtn" id="bookBack">←</button>
    <div class="brand"><b id="bookHd">读书</b></div>
  </header>
  <div class="body">
    <div style="padding:0 0 8px"><input id="bookQ" class="inp" placeholder="搜书名" autocomplete="off" spellcheck="false" style="width:100%;padding:10px 12px;border-radius:10px;border:1px solid #2a2f3a;background:#12151c;color:#e6e9ef;font-size:14px"></div>
    <div id="bookList"></div>
  </div>
</div>

<!-- 朗读条 -->
<div id="reader"><div class="rdt" id="rdTitle">…</div><div class="rdb"><i id="rdBar"></i></div><div class="rdc"><span id="rdPct">0%</span><button id="rdPlay" class="rdb2">⏸</button><button id="rdSlow" class="rdb2">1×</button><button id="rdX" class="rdb2">✕</button></div></div>

<!-- 登录 -->
<div id="gate" class="hide">
  <div class="logo">✦</div>
  <h1 id="gTitle">把脑子装进手机</h1>
  <p id="gSub">输一个邮箱就开始用。7 天免费，之后 $8 一个月，不用挑模型。</p>
  <input id="gMail" type="email" inputmode="email" autocomplete="email" placeholder="你的邮箱">
  <button class="btn primary" id="gGo">开始</button>
  <div class="tip" id="gTip">同一个邮箱在电脑和手机上都是一个账号</div>
  <div style="text-align:center;margin-top:10px;line-height:2">
    <a id="gHow" href="https://buzzmartglobal-art.github.io/sidebrain/install.html" style="color:#8fb0ff;font-size:13px;text-decoration:none">怎么装到主屏？</a><br>
    <a id="gSprite" href="https://buzzmartglobal-art.github.io/sidebrain/install.html#iphone" style="color:#8b93a1;font-size:12.5px;text-decoration:none"></a>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="fileWrap" style="display:none"><input type="file" id="file" accept="image/*,text/*,.md,.json,.csv,.txt,.log"></div>

<script>
(() => {
  'use strict';
  // ?lang=zh / ?lang=en 可以强制界面语言（手机上系统语言是英文但你想看中文时用）
  const LANGQ = (new URLSearchParams(location.search).get('lang') || '').toLowerCase();
  const EN = LANGQ ? LANGQ.startsWith('en')
                   : ((navigator.language || '').toLowerCase().startsWith('en') && !(navigator.language || '').toLowerCase().startsWith('zh'));
  const T = {
    zh: { hi:'要问点什么？', hp:'截图、文件、语音都能直接发进来，回答会自动存进你的笔记库。',
      ph:'发消息…', hint:'回答来自自动选中的模型，你不用挑', notes:'笔记', settings:'设置',
      send:'发送', thinking:'在想…', copy:'复制', copied:'已复制', retry:'重试', del:'删除',

  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  // 地址解析：直接开在 Sidebrain 服务器上就用同源；开在 GitHub Pages 上就按 endpoint.json 找当前隧道
  let base = location.origin;
  const kv = key => ({
    get() { return localStorage.getItem('sb_' + key) || ''; },
    set(v) { v === '' || v == null ? localStorage.removeItem('sb_' + key) : localStorage.setItem('sb_' + key, String(v)); },
  });
  const store = {
    get k(){ return localStorage.getItem('sb_token') || ''; },
    set k(v){ v ? localStorage.setItem('sb_token', v) : localStorage.removeItem('sb_token'); },
    get mode(){ return localStorage.getItem('sb_mode') || ''; }, set mode(v){ kv('mode').set(v); },
    get csub(){ return localStorage.getItem('sb_csub') || ''; }, set csub(v){ kv('csub').set(v); },
    get lvl(){ return localStorage.getItem('sb_lvl') || ''; },   set lvl(v){ kv('lvl').set(v); },
    get hands(){ return localStorage.getItem('sb_hands') === '1'; }, set hands(v){ localStorage.setItem('sb_hands', v ? '1' : '0'); },
  };
  let ACCT = null;
  const CHAT_KEY = 'sb_chat_v1';

  function toast(msg, ms = 1900) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
  }

  /* ---------- 遥测：?dbg=1 时把自己的状态报给服务器（真机出问题时有据可查） ---------- */
  const DBG_ON = /[?&]dbg=1/.test(location.search) || (() => { try { return localStorage.getItem('sb_dbg') === '1'; } catch (_) { return false; } })();
  let DBG_Q = [];
  const dbg = (ev, o) => { if (!DBG_ON) return; try { DBG_Q.push({ ev, ...(o || {}) }); flushDbg(); } catch (_) {} };
  let dbgTimer = 0;
  function flushDbg() {
    if (!DBG_ON || !DBG_Q.length) return;
    clearTimeout(dbgTimer);
    dbgTimer = setTimeout(async () => {
      const batch = DBG_Q.splice(0, 12);
      for (const item of batch) {
        try {
          const b = await ensureBase();
          await fetch(b + '/dbg', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ...item, build: BUILD, ua: navigator.userAgent.slice(0, 80) }) });
        } catch (_) {}
      }
    }, 60);
  }

  // 把关键控件的真实位置报上来：真机自动化点按靠这个对齐坐标
  function reportGeom() {
    if (!DBG_ON) return;
    const vv = window.visualViewport || {};
    const mid = el => { const b = el && el.getBoundingClientRect(); return b ? { x: Math.round(b.x + b.width / 2), y: Math.round(b.y + b.height / 2) } : null; };
    const chips = [...document.querySelectorAll('#coachbar .cchip')].map(x => ({ t: x.textContent.slice(0, 14), ...mid(x) }));
    const quick = [...document.querySelectorAll('#quick button')].map(x => ({ t: x.textContent.slice(0, 14), ...mid(x) }));
    dbg('geom', {
      dpr: window.devicePixelRatio, vw: window.innerWidth, vh: window.innerHeight,
      vvTop: Math.round(vv.offsetTop || 0), vvH: Math.round(vv.height || 0), scrollY: Math.round(scrollY || 0),
      pill: mid(document.getElementById('modepill')), composer: mid(document.getElementById('ta')),
      send: mid(document.getElementById('send')), state: mid(document.getElementById('hstate')),
      coachbar: mid(document.getElementById('coachbar')), chips, quick,
    });
  }

  let baseReady = null;
  function ensureBase() {
    if (!baseReady) baseReady = (async () => {
      // 自己就是 Sidebrain 服务器？
      try {
        const h = await fetch(location.origin + '/health', { cache: 'no-store' });
        if (h.ok) return location.origin;
      } catch (_) {}
      // 不是的话说明这是个静态页（GitHub Pages），按 endpoint.json 找当前隧道
      for (const f of ['endpoint.json', '../endpoint.json']) {
        try {
          const j = await (await fetch(f, { cache: 'no-store' })).json();
          if (j && j.serverBase) return String(j.serverBase).replace(/\/$/, '');
        } catch (_) {}
      }
      return location.origin;
    })();
    return baseReady;
  }

  async function api(path, body, { method } = {}) {
    base = await ensureBase();
    const r = await fetch(base + path, {
      method: method || (body ? 'POST' : 'GET'),
      headers: { 'content-type': 'application/json', ...(store.k ? { authorization: 'Bearer ' + store.k } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const txt = await r.text();
    let j = null; try { j = JSON.parse(txt); } catch (_) { j = { raw: txt }; }
    if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; e.data = j; throw e; }
    return j;
  }

  /* ---------- Markdown ---------- */
  function md(s) {
    let src = esc(s || '');
    src = src.replace(/```([\s\S]*?)```/g, (_, c) => '<pre>' + c.replace(/^\w*\n/, '') + '</pre>');
    src = src.replace(/`([^`\n]+)`/g, '<code>$1</code>');
    src = src.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    src = src.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    const out = []; let list = null;
    const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    for (const raw of src.split('\n')) {
      const l = raw.trimEnd();
      const h = /^(#{1,6})\s+(.*)$/.exec(l);
      if (h) { close(); out.push('<h' + h[1].length + '>' + h[2] + '</h' + h[1].length + '>'); continue; }
      if (/^\s*[-*]\s+\[[ xX]\]\s+/.test(l)) {
        if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; }
        out.push('<li>' + l.replace(/^\s*[-*]\s+\[([ xX])\]\s+/, (_, c) => c === ' ' ? '☐ ' : '☑ ') + '</li>'); continue;
      }
      if (/^\s*[-*]\s+/.test(l)) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + l.replace(/^\s*[-*]\s+/, '') + '</li>'); continue; }
      if (/^\s*\d+\.\s+/.test(l)) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + l.replace(/^\s*\d+\.\s+/, '') + '</li>'); continue; }
      close();
      if (/^>\s?/.test(l)) { out.push('<blockquote>' + l.replace(/^>\s?/, '') + '</blockquote>'); continue; }
      if (/^---+$/.test(l.trim())) { out.push('<hr>'); continue; }
      if (!l.trim()) { out.push(''); continue; }
      out.push('<p>' + l + '</p>');
    }
    close();
    return out.join('\n');
  }

  /* ---------- 对话 ---------- */
  let CHAT = [];
  try { CHAT = JSON.parse(localStorage.getItem(CHAT_KEY) || '[]'); } catch (_) { CHAT = []; }
  const saveChat = () => { try { localStorage.setItem(CHAT_KEY, JSON.stringify(CHAT.slice(-40))); } catch (_) {} };

  const feed = $('#feed');
  function rowEl(role, text, extra = '') {
    const wrap = document.createElement('div');
    wrap.className = 'row ' + (role === 'user' ? 'me' : 'ai');
    const b = document.createElement('div');
    b.className = 'bub';
    b.innerHTML = role === 'user' ? esc(text) : md(text);
    wrap.appendChild(b);
    if (extra) b.insertAdjacentHTML('beforeend', extra);
    return { wrap, bub: b };
  }

  function paintChat() {
    feed.querySelectorAll('.row').forEach(n => n.remove());
    $('#hello').style.display = CHAT.length ? 'none' : '';
    for (const m of CHAT) {
      if (m.hide) continue;
      const { wrap, bub } = rowEl(m.role, m.text, attHtml(m.att));
      if (m.role === 'assistant') addMeta(bub, m);
      feed.appendChild(wrap);
    }
    feed.scrollTop = feed.scrollHeight;
  }

  function attHtml(att) {
    if (!att) return '';
    let h = '';
    if (att.image) h += '<div class="att-chip"><img src="' + att.image + '" alt=""></div>';
    if (att.files && att.files.length) h += '<div class="att-chip">📄 ' + esc(att.files.map(f => f.name).join(', ')).slice(0, 120) + '</div>';
    return h;
  }

  function addMeta(bub, m) {
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML =
      '<button data-a="copy">' + T.copy + '</button>' +
      (m.saved ? '<span>🗒 ' + T.saved + '</span>' : '') +
      '<span>' + esc(m.channel || '') + (m.ms ? ' · ' + (m.ms / 1000).toFixed(1) + 's' : '') + '</span>';
    meta.querySelector('[data-a="copy"]').onclick = async () => {
      try { await navigator.clipboard.writeText(m.text); toast(T.copied); } catch (_) { toast(T.copied); }
    };
    bub.appendChild(meta);
  }

  /* ---------- 附件 ---------- */
  const ATT = { image: null, files: [] };
  const attbar = $('#attbar');
  function paintAtt() {
    attbar.innerHTML = '';
    if (ATT.image) attbar.appendChild(chip('🖼', 'image', ATT.image, ATT.image));
    ATT.files.forEach((f, i) => attbar.appendChild(chip('📄', f.name, null, null, i)));
    autoGrow();
  }
  function chip(icon, label, img, src, idx) {
    const c = document.createElement('div');
    c.className = 'chip';
    c.innerHTML = (img ? '<img src="' + src + '" alt="">' : '<span>' + icon + '</span>') +
      '<b>' + esc(label) + '</b><button class="x">✕</button>';
    c.querySelector('.x').onclick = () => {
      if (img) ATT.image = null; else ATT.files.splice(idx, 1);
      paintAtt();
    };
    return c;
  }
  async function shrink(file) {
    return new Promise(res => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const MAX = 1400;
        let { width: w, height: h } = img;
        const s = Math.min(1, MAX / Math.max(w, h));
        w = Math.round(w * s); h = Math.round(h * s);
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        res(cv.toDataURL('image/jpeg', 0.86));
      };
      img.onerror = () => { URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  }
  async function takeFile(f) {
    if (!f) return;
    if (/^image\//.test(f.type)) {
      const d = await shrink(f);
      if (d) { ATT.image = d; paintAtt(); return; }
    }
    const txt = await f.text().catch(() => '');
    ATT.files.push({ name: f.name, text: (txt || '').slice(0, 60000) });
    paintAtt();
  }
  $('#btnFile').onclick = () => $('#file').click();
  $('#file').onchange = async e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; await takeFile(f); };

  // 粘贴
  document.addEventListener('paste', async e => {
    const it = [...(e.clipboardData && e.clipboardData.items || [])];
    for (const i of it) if (i.kind === 'file') { const f = i.getAsFile(); if (f) { await takeFile(f); e.preventDefault(); } }
  });

  /* ---------- 语音 ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recOn = false;
  const mic = $('#btnMic');
  mic.onclick = () => {
    if (!SR) { toast(T.voiceUnsupported, 2600); return; }
    if (recOn) { try { rec.stop(); } catch (_) {} return; }
    // 免手开着但耳朵停了（比如 iOS 断掉一次）→ 手动续上
    if (typeof HANDS !== 'undefined' && HANDS) { unlockTTS(); startListen(); return; }
    if (recOn) { try { rec.stop(); } catch (_) {} return; }
    rec = new SR();
    // 教练模式下必须用英文识别，否则说的是英文、识别的是中文
    rec.lang = (typeof coachOn === 'function' && coachOn()) ? 'en-US' : (navigator.language || 'zh-CN');
    rec.interimResults = true;
    rec.continuous = false;
    const ta = $('#ta'); const before = ta.value;
    rec.onstart = () => { recOn = true; mic.classList.add('rec'); toast(T.listening, 9000); };
    rec.onresult = e => {
      let s = '';
      for (let i = e.resultIndex; i < e.results.length; i++) s += e.results[i][0].transcript;
      ta.value = (before ? before + ' ' : '') + s; autoGrow();
    };
    rec.onerror = () => { toast(T.voiceUnsupported, 2400); };
    rec.onend = () => { recOn = false; mic.classList.remove('rec'); autoGrow(); };
    try { rec.start(); } catch (_) {}
  };

  /* ---------- 输入框 ---------- */
  const ta = $('#ta');
  function autoGrow() { ta.style.height = 'auto'; ta.style.height = Math.min(130, ta.scrollHeight) + 'px'; }
  ta.addEventListener('input', autoGrow);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  $('#send').onclick = send;

  /* ---------- 发送 ---------- */
  let busy = false;
  let SILENT_NEXT = false;
  async function send() {
    const text = ta.value.trim();
    if (busy) return;
    if (!text && !ATT.image && !ATT.files.length) return;
    if (HANDS) stopSpeaking();        // 你一开口，它就先闭上嘴
    busy = true; $('#send').disabled = true;
    const att = { image: ATT.image, files: ATT.files.slice() };
    const shown = text || (att.image ? '📷 ' + T.img : '📄 ' + att.files.map(f => f.name).join(', '));
    const msg = { role: 'user', text: shown, att: { image: att.image, files: att.files.map(f => ({ name: f.name })) } };
    const silent = SILENT_NEXT; SILENT_NEXT = false;
    CHAT.push(msg);
    if (silent) msg.hide = true;
    if (!silent) {
      const { wrap } = rowEl('user', shown, attHtml(msg.att));
      feed.appendChild(wrap);
    }
    $('#hello').style.display = 'none';
    ta.value = ''; ATT.image = null; ATT.files = []; paintAtt(); autoGrow();
    feed.scrollTop = feed.scrollHeight;

    const wait = document.createElement('div');
    wait.className = 'row ai';
    wait.innerHTML = '<div class="bub"><div class="typing"><i></i><i></i><i></i></div></div>';
    feed.appendChild(wait);
    feed.scrollTop = feed.scrollHeight;

    const payload = {
      messages: CHAT.filter(m => m.role === 'user' || m.role === 'assistant').slice(-24).map(m => ({ role: m.role, content: m.text })),
      image: att.image ? { dataUrl: att.image } : null,
      files: att.files,
      url: '',
      title: document.title,
    };
    if (bookActive() && BOOK.total) {
      const pct = Math.round((BOOK.pos / BOOK.total) * 100);
      payload.system = [
        'You are also reading a book to me out loud: "' + BOOK.title + '" (about ' + pct + '% in).',
        BOOK.sum ? 'Story so far: ' + BOOK.sum : '',
        BOOK.last ? 'The passage I am hearing right now:\n' + BOOK.last.slice(0, 900) : '',
        'When I ask about the book, answer from that text and keep every name and event consistent with it. When I ask what happened, summarise what I have actually heard, not the whole novel.',
        'I do the reading by tapping the player, so never paste long passages back to me - at most quote a short line.',
        'While we are on the book you may use up to 90 words.',
      ].filter(Boolean).join('\n');
    }
    if (coachOn()) {
      payload.system = (payload.system ? payload.system + '\n' : '') + coachSys() + '\n' + lvlLine();
      // 口语对话要的是「快」：直接告诉服务端走简单的快通道，不走分类器、不排深度模型
      payload.kind = 'simple';
      payload.level = 1;
    }
    // 用户那条的真实文字（带附件时 text 可能是占位）
    const lastMsg = payload.messages[payload.messages.length - 1];
    if (lastMsg && !text) lastMsg.content = (att.image ? '[图片] ' : '') + (att.files.map(f => '[文件] ' + f.name).join(' ') || '看图');

    try {
      const r = await api('/v1/chat', payload);
      wait.remove();
      CHAT.push({ role: 'assistant', text: r.text, channel: r.channel, ms: r.ms, saved: r.saved, kind: r.kind });
      dbg('reply', { ch: r.channel, ms: r.ms, len: String(r.text || '').length, csub: CSUB });
      const { wrap: w2, bub } = rowEl('assistant', r.text);
      addMeta(bub, CHAT[CHAT.length - 1]);
      if (coachOn()) { bumpTurn(); collectFixes(r.text); }
      feed.appendChild(w2);
      if (CSUB === 'read') READ_TARGET = String(r.text || '').replace(/^(Better|Corrections|Rewritten)[^\n]*\n?/gim, '').split(/\n/).map(x => x.trim()).filter(x => /[a-z]/i.test(x))[0] || '';
      try { if (HANDS) speakOut(r.text); } catch (_) { setTimeout(startListen, 300); }
      if (r.saved) toast('🗒 ' + T.saved, 1500);
    } catch (e) {
      wait.remove();
      const note = e.status === 402 ? '试用结束了，去 /join 订阅（$8/月）' : (e.message || T.netFail);
      const { wrap: w3, bub } = rowEl('assistant', '⚠️ ' + note);
      const again = document.createElement('div');
      again.className = 'meta';
      again.innerHTML = '<button>' + T.retry + '</button>';
      again.querySelector('button').onclick = () => { w3.remove(); CHAT.pop(); ta.value = shown; send(); };
      bub.appendChild(again);
      feed.appendChild(w3);
      if (HANDS) setTimeout(startListen, 1200);
    }
    busy = false; $('#send').disabled = false;
    saveChat();
    feed.scrollTop = feed.scrollHeight;
  }

  /* ---------- 账号 ---------- */
  setTimeout(reportGeom, 900);

  /* ---------- 设备自检：?selftest=1 ----------
     屏幕锁着 / 没有手指头可用的时候，用它把真机上「模型、语音、麦克风」三条链路各跑一遍，
     结果直接报到服务器（/dbg?tail=）。不替代点按，但它跑的是同一份代码。 */
  if (/[?&]selftest=1/.test(location.search)) {
    const rep = (o) => dbg('sim', o);
    setTimeout(async () => {
      rep({ step: 'caps', dpr: devicePixelRatio, vw: innerWidth, vh: innerHeight, sr: !!SR, tts: !!TTS, stand: navigator.standalone === true });
      try {
        const r = await api('/v1/chat', {
          messages: [{ role: 'user', content: 'Start the session.' }],
          system: COACH_MODES.natural.sys + '\n' + lvlLine(), kind: 'simple', level: 1,
        });
        rep({ step: 'chat', ch: r.channel, ms: r.ms, len: String(r.text || '').length });
        const chunk = spokenPart(r.text) || 'Hello.';
        const t0 = Date.now();
        const url = await ttsFetch(chunk);
        rep({ step: 'tts_ok', ms: Date.now() - t0, chars: chunk.length });
        // 能不能真的放出声（没有用户手势时 iOS 会拦）
        const meta = await new Promise(res => {
          const a = new Audio(url);
          let done = false;
          a.onloadedmetadata = () => { if (!done) { done = true; res({ dur: Math.round((a.duration || 0) * 10) / 10 }); } };
          a.onerror = () => { if (!done) { done = true; res({ err: 'media error' }); } };
          setTimeout(() => { if (!done) { done = true; res({ dur: Math.round((a.duration || 0) * 10) / 10 }); } }, 4000);
        });
        rep({ step: 'audio_meta', ...meta });
        let playErr = '';
        try {
          await AUD.play();
          await new Promise(r2 => setTimeout(r2, 500));
          rep({ step: 'play', ok: AUD.currentTime > 0.05, t: Math.round(AUD.currentTime * 10) / 10, paused: AUD.paused });
          try { AUD.pause(); } catch (_) {}
        } catch (e) { playErr = String(e && e.name || e); rep({ step: 'play', ok: false, err: playErr }); }
        try { URL.revokeObjectURL(url); } catch (_) {}
      } catch (e) { rep({ step: 'chat_fail', err: String(e && e.message || e).slice(0, 140) }); }
      // 麦克风：能不能开口
      if (SR) {
        try {
          const r = new SR();
          r.lang = 'en-US'; r.interimResults = false; r.continuous = false;
          let done = false;
          const fin = (o) => { if (!done) { done = true; rep({ step: 'sr', ...o }); } };
          r.onstart = () => fin({ started: true });
          r.onerror = (e) => fin({ started: false, err: String((e && e.error) || ''), msg: String((e && e.message) || '').slice(0, 80) });
          r.onresult = (e) => fin({ started: true, heard: String(e.results[0][0].transcript).slice(0, 60) });
          try { r.start(); } catch (e) { fin({ started: false, err: 'throw ' + String(e && e.name || e) }); }
          setTimeout(() => { try { r.stop(); } catch (_) {} if (!done) fin({ started: false, err: 'no event' }); }, 6000);
        } catch (e) { rep({ step: 'sr', started: false, err: 'setup ' + String(e && e.name || e) }); }
      } else rep({ step: 'sr', started: false, err: 'no SR object' });
      rep({ step: 'done' });
    }, 1500);
  }

  // 跟读打分：字级重合率，够用来让人看到自己漏了哪个词
  function readScore(said, target) {
    const norm = t => String(t || '').toLowerCase().replace(/[^a-z0-9' ]/g, ' ').split(/\s+/).filter(Boolean);
    const a = norm(said), b = norm(target);
    if (!b.length) return { pct: 0, miss: [] };
    // LCS 长度
    const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
    const matched = dp[a.length][b.length];
    const used = new Set();
    for (let i = 0, j = 0; i < a.length && j < b.length;) {
      if (a[i] === b[j]) { used.add(j); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
    }
    const miss = b.filter((w, idx) => !used.has(idx));
    return { pct: Math.round(100 * matched / b.length), miss: miss.slice(0, 6) };
  }

  /* ---------- 真人的嗓子：服务端神经 TTS（ElevenLabs / Gemini），一句一个请求 ---------- */
  // 为什么一句一请求：整段合成要等 3-6 秒；切句后第一句 1.5 秒就能出声，
  // 后面几句在念第一句的时候已经并行在服务器上合成了。
  const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';
  let VOICE = 'aoede';

  async function loadTtsKey() {

  const pickVoiceName = () => (VOICE === 'aoede' ? (EN ? 'Aoede · warm female' : 'Aoede · 温暖女声')

    : VOICE === 'leda' ? (EN ? 'Leda · young female' : 'Leda · 年轻女声') : VOICE);
  const AUD = new Audio();

  function scoreRead(said) {
    const r = readScore(said, READ_TARGET);
    const miss = r.miss.length ? (EN ? ' · missed: ' + r.miss.join(', ') : ' · 漏了 ' + r.miss.join('、')) : '';
    toast((EN ? 'Read-aloud ' : '跟读 ') + r.pct + '%' + miss, 4200);
    const badge = document.createElement('div');
    badge.className = 'meta';
    badge.textContent = (EN ? 'Read-aloud ' : '跟读 ') + r.pct + '%' + miss;
    feed.appendChild(badge);
    feed.scrollTop = feed.scrollHeight;
  }

  // 复盘：让教练给一张成绩单，并落进笔记
  const FIX_KEY = 'sb_fixes';
  function collectFixes(text) {
    try {
      const found = String(text || '').match(/Better:\s*([^\n]+)/gi) || [];
      if (!found.length) return;
      const list = JSON.parse(localStorage.getItem(FIX_KEY) || '[]');
      found.forEach(f => {
        const line = f.replace(/^Better:\s*/i, '').trim();
        if (line && !list.some(x => x.s === line)) list.push({ s: line, d: DAY });
      });
      localStorage.setItem(FIX_KEY, JSON.stringify(list.slice(-300)));
    } catch (_) {}
  }
  async function saveWordBank() {
    try {
      const list = JSON.parse(localStorage.getItem(FIX_KEY) || '[]');
      if (!list.length) return null;
      const fresh = list.filter(x => x.d === DAY);
      const body = ['# 英语错题本 ' + DAY, '',
        '> 教练每轮挑出来的一句「更地道的说法」。左边是我说的，右边是应该说的。', '',
        ...(fresh.length ? fresh : list.slice(-20)).map((x, i) => (i + 1) + '. ' + x.s), '',
        '（共 ' + (fresh.length || list.length) + ' 句，由 Sidebrain 英语教练自动收集）'].join('\n');
      await api('/vault/write', { path: '英语教练/错题本-' + DAY + '.md', body });
      return '英语教练/错题本-' + DAY + '.md';
    } catch (_) { return null; }
  }

  function noteMd(body) {
    let s = String(body || '').replace(/^---\n[\s\S]*?\n---\n/, '');
    let h = md(s);
    h = h.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, note, label) => '<span class="nl" data-note="' + note.trim() + '">' + (label || note).trim() + '</span>');
    return h;
  }

      '</div>' +
      '<div class="sec">用</div>' +
      '<div class="rowitem" id="mNotes"><div class="t"><b>🗒 ' + T.notes + '</b></div><div class="k">›</div></div>' +
      '<div class="rowitem" id="mExport"><div class="t"><b>⬇ ' + T.exportV + '</b><span>' + T.exportTip + '</span></div><div class="k">›</div></div>' +
      '<div class="rowitem" id="mClear"><div class="t"><b>🧹 ' + T.clear + '</b></div><div class="k">›</div></div>' +
      '<div class="rowitem" id="mLogout"><div class="t"><b>👤 ' + T.logout + '</b></div><div class="k">›</div></div>' +
      '<div class="sec">关于</div>' +
      '<div class="rowitem"><div class="t"><b>Sidebrain</b><span>' + (EN ? 'Routes each message to the cheapest model that fits. Notes stay in plain Markdown.' : '每条消息自动交给最合适又最便宜的模型。笔记就是普通 Markdown 文件。') + '</span></div></div>' +
      '<div class="hint" style="padding-top:16px">' + (EN ? 'Tip: Share → Add to Home Screen to use it like an app.' : '提示：点 Safari 的分享 → 添加到主屏幕，用起来就跟 App 一样。') + '</div>' +
      '<div class="hint" style="text-align:center;opacity:.45;font-size:11.5px;padding-top:6px">v20-26 02:5-</div>';
    $('#mVoiceTop').onclick = () => {
      const box = $('#voiceBox');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    };
    document.querySelectorAll('.vsel').forEach(b => {
      b.onclick = async () => {
        VOICE = b.dataset.v;
        try { localStorage.setItem('sb_voice', VOICE); } catch (_) {}
        document.querySelectorAll('.vsel').forEach(x => x.classList.toggle('act', x.dataset.v === VOICE));
        unlockTTS();
        sayAll(EN ? 'Hi, this is how I sound. Let us keep going.' : 'Hi, this is how I sound.', 1);
        try { await api('/account/tts-key', { voice: VOICE }); } catch (_) {}
        toast('🔊 ' + pickVoiceName(), 1400);
      };
    });
    $('#elSave').onclick = async () => {
      const k = ($('#elKey').value || '').trim();
      if (!/^[A-Za-z0-9_\-]{20,}$/.test(k)) { toast(EN ? 'That does not look like a key' : '这个不像 key', 2000); return; }
      try {
        await api('/account/tts-key', { key: k });
        EL_HAS = true; toast(EN ? 'ElevenLabs on — try the voice again' : 'ElevenLabs 接上了，再点一次嗓音试试', 2400);
        $('#elKey').value = '•••• 已保存';
      } catch (e) { toast(e.message || 'save failed', 2400); }
    };
    $('#elClear').onclick = async () => {
      try { await api('/account/tts-key', { key: '' }); EL_HAS = false; $('#elKey').value = ''; toast('✓', 1200); } catch (_) {}
    };
    $('#mCoach').onclick = () => {
      setMode(coachOn() ? 'chat' : 'coach');
      closeSheet(menuSheet);
      toast(coachOn() ? (EN ? '🗣 English coach on' : '🗣 英文教练已开启') : (EN ? 'Back to normal chat' : '回到普通对话'), 1500);
    };
    $('#mBook').onclick = () => { primeAudio(); closeSheet(menuSheet); if (bookActive()) { resumeBook(); } else { openBooks(); } };
    $('#mNotes').onclick = () => { closeSheet(menuSheet); openSheet(sheet); noteList(''); };
    $('#mShareAddr').onclick = async () => {
      const addr = (await ensureBase()) + '/share?token=' + encodeURIComponent(store.k);
      try { await navigator.clipboard.writeText(addr); toast(T.addrCopied); }
      catch (_) { prompt(T.shareAddr, addr); }
    };
    $('#mSpriteLive').onclick = async () => {
      const b = await ensureBase();
      // 装一次就常驻：说明页里有 App Store 链接、开启扩展的步骤、以及带连接码的安装按钮
      const w = window.open(b + '/u/' + encodeURIComponent(store.k), '_blank');
      if (!w) location.href = b + '/u/' + encodeURIComponent(store.k);
    };
    $('#mSpriteFile').onclick = async () => {
      const b = await ensureBase();
      const url = b + '/u/' + encodeURIComponent(store.k) + '/dl';
      const w = window.open(url, '_blank');
      if (!w) location.href = url;
    };
    $('#mSpriteCheck').onclick = async () => {
      const b = await ensureBase();
      const url = b + '/u/' + encodeURIComponent(store.k) + '/check';
      const w = window.open(url, '_blank');
      if (!w) location.href = url;
    };
    $('#mSpriteApp').onclick = async () => {
      const b = await ensureBase();
      // iOS 26 起不再支持 shortcuts:// 自助导入（会弹「The shortcut URL provided was invalid」），
      // 只剩「下载 → 点文件」这一条路，所以这里老老实实给下载。
      const url = b + '/sprite/shortcut?token=' + encodeURIComponent(store.k);
      toast(T.spriteBusy || '正在准备…');
      const w = window.open(url, '_blank');
      if (!w) location.href = url;
    };
    $('#mSpriteDl').onclick = async () => {
      const b = await ensureBase();
      try {
        // 要的不是裸脚本体，是带 UserScript 头的整份 —— 粘进 Userscripts 新建的脚本里才能直接生效
        const js = await (await fetch(b + '/u/' + encodeURIComponent(store.k) + '.user.js')).text();
        await navigator.clipboard.writeText(js);
        toast(T.spriteJsCopied);
      } catch (_) { toast(T.spriteBusy || '没取到脚本，过一下再点'); }
    };
    $('#mSpriteCode').onclick = async () => {
      const b = await ensureBase();
      // 书签（bookmarklet）：不用装任何扩展，这是 iPhone 上唯一不依赖第三方的常驻方式。
      // 地址三层兜底：同源 fetch endpoint.json → <script> 拉 current.js（Pages 不给 CORS 头，
      // 但脚本不受同源限制）→ 复制时记下的地址。所以隧道换域名，书签也不用重存。
      const PAGES = 'https://buzzmartglobal-art.github.io/sidebrain/';
      const code = 'javascript:(function(){if(window.__SB_SPRITE__)return;' +
        'var TK=' + JSON.stringify(store.k) +
        ',B=' + JSON.stringify(b) +
        ',EP=' + JSON.stringify(PAGES + 'endpoint.json') +
        ',CJ=' + JSON.stringify(PAGES + 'current.js') +
        ';function run(x){if(window.__SB_SPRITE__)return;window.__SB_TOKEN__=TK;window.__SB_BASE__=x;' +
        'var s=document.createElement("script");s.src=x+"/sprite.js?t="+Date.now();' +
        's.onerror=function(){location.href=x+"/m/?u="+encodeURIComponent(location.href);};' +
        'document.documentElement.appendChild(s);}' +
        'function viaScript(){var g=document.createElement("script");g.src=CJ+"?t="+Date.now();' +
        'g.onload=function(){run(window.__SB_CUR||B);};g.onerror=function(){run(B);};' +
        'document.documentElement.appendChild(g);}' +
        'try{fetch(EP,{cache:"no-store"}).then(function(r){return r.json();})' +
        '.then(function(j){run((j&&j.serverBase)||B);}).catch(viaScript);}catch(e){viaScript();}})()';
      try { await navigator.clipboard.writeText(code); window.__SB_LAST_BM = code; toast(T.spriteCopied); setTimeout(showHowTo, 260); }
      catch (_) { prompt(T.spriteCode, code); }
    };
    $('#mExport').onclick = () => { closeSheet(menuSheet); exportVault(); };
    $('#mClear').onclick = () => {
      if (!confirm(T.clear + '?')) return;
      CHAT = []; saveChat(); paintChat(); closeSheet(menuSheet); toast('✓');
    };
    $('#mLogout').onclick = async () => {
      store.k = '';
      CHAT = []; saveChat(); paintChat();
      closeSheet(menuSheet);
      $('#gMail').value = (ACCT && ACCT.email) || '';
      $('#gate').classList.remove('hide');
    };
  }


  /* ---------- 书签怎么存（复制后立刻给出六步） ---------- */
  const BM_STEPS = EN ? [
    'iOS 26: tap the <b>Page Menu</b> (the <b>⋯</b> left of the address bar) → <b>Add Bookmark to…</b> → <b>Save</b>.',
    'Name the bookmark <code>Sidebrain</code> → choose <b>Favorites</b>.',
    'Open <b>Bookmarks</b> (open-book icon at the bottom, or long-press the toolbar and drag) → <b>Edit</b> → tap <b>Sidebrain</b>.',
    'Delete the whole <b>Address</b> line → <b>Paste</b> → <b>Done</b>. The address becomes <code>javascript:…</code>',
    'On any page: <b>Bookmarks</b> → tap <b>Sidebrain</b>. The pill shows up bottom-right.',
  ] : [
    'iOS 26：点地址栏左边的 <b>⋯</b>（页面菜单）→ <b>添加到书签</b> → <b>存储</b>。',
    '名字写 <code>Sidebrain</code> → 位置选 <b>个人收藏</b>。',
    '打开 <b>书签</b>（底部书形图标，或长按工具栏拖到书签）→ <b>编辑</b> → 点 <b>Sidebrain</b>。',
    '把 <b>地址那一栏整行删掉</b> → <b>粘贴</b> → <b>完成</b>，地址变成 <code>javascript:…</code> 就对了。',
    '以后任何网页：<b>书签</b> → 点 <b>Sidebrain</b>，右下角出现药丸。',
  ];
  function showHowTo() {
    $('#howtoCard').innerHTML =
      '<h3>' + (EN ? 'Turn it into a bookmark' : '把它存成一个书签') + '</h3>' +
      '<p class="sub">' + (EN ? 'The code is already copied. Five taps and you are done.' : '代码已经复制好了，五步就完。') + '</p>' +
      '<ol>' + BM_STEPS.map(x => '<li>' + x + '</li>').join('') + '</ol>' +
      '<div class="warn">' + (EN
        ? 'If Safari searches the web instead, the <code>javascript:</code> start got eaten — paste again from the <b>j</b>.'
        : '如果点下去变成搜索，说明粘的时候把 <code>javascript:</code> 开头吞掉了——从 <b>j</b> 开始重新粘。') + '</div>' +
      '<button id="howtoOk">' + (EN ? 'Got it' : '知道了') + '</button>';
    $('#howto').classList.remove('hide');
    $('#howtoOk').onclick = () => $('#howto').classList.add('hide');
  }

  // 调试用（也方便以后远程看状态）
  window.__SB_COACH = () => ({ hands: HANDS, recOn, turns: TURNS, csub: CSUB, level: LEVEL, busy, chat: CHAT.length });

  /* ---------- 启动 ---------- */
  document.documentElement.lang = EN ? 'en' : 'zh';
  $('#h1').textContent = T.hi; $('#hp').textContent = T.hp;
  ta.placeholder = T.ph; $('#hint').textContent = T.hint;
  $('#gTitle').textContent = T.gateTitle; $('#gSub').textContent = T.gateSub;
  $('#gGo').textContent = T.gateBtn; $('#gMail').placeholder = T.gateMail; $('#gTip').textContent = T.gateTip;
  $('#gHow').textContent = T.howto;
  $('#gSprite').textContent = T.sprite;
  paintQuick();
  // 带连接码的链接（?k=sb_…）：自己用的直通入口，点开就是已登录状态，不用输邮箱
  (function takeTokenFromUrl() {
    try {
      const q = new URLSearchParams(location.search);
      const tk = q.get('k') || q.get('token');
      if (tk && /^sb_[A-Za-z0-9_]+$/.test(tk)) { store.k = tk; }
      const bs = q.get('base');
      if (bs && /^https?:\/\//.test(bs)) store.base = bs;
      if (tk) history.replaceState(null, '', location.pathname + '?u=' + encodeURIComponent(location.pathname));
    } catch (_) {}
  })();

  // 在 Safari 里打开（不是主屏独立窗口）时，底部有浏览器工具栏，输入框往上让一点
  try {
    const standalone = (navigator.standalone === true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    if (!standalone) document.body.classList.add('inbrowser');
  } catch (_) {}

  paintMode();
  paintChat();
  if (store.k) refreshAcct(); else $('#gate').classList.remove('hide');
  checkFresh();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkFresh(); });
  setInterval(() => { if (store.k && !ACCT) refreshAcct(); }, 60000);
  window.addEventListener('online', () => refreshAcct());
})();
</script>
<div id="howto" class="hide"><div class="card2" id="howtoCard"></div></div>
</body>
</html>
